<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dashboard - Liquid Glass Todo</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- HEADER -->
  <header class="glass header">

    <div class="logo-small">🧊 Todo</div>

    <input type="search" placeholder="Search tasks...">

    <button id="themeToggle">🌙</button>

    <button onclick="logout()">Logout</button>

  </header>

  <!-- STATS -->
  <section class="stats">

    <div class="stat glass">
      <h3>Total</h3>
      <p id="totalTasks">0</p>
    </div>

    <div class="stat glass">
      <h3>Completed</h3>
      <p id="completedTasks">0</p>
    </div>

    <div class="stat glass">
      <h3>Pending</h3>
      <p id="pendingTasks">0</p>
    </div>

  </section>

  <!-- MAIN AREA -->
  <main class="dashboard">

    <!-- ADD TASK -->
    <div class="glass task-form">

      <h2>Add New Task</h2>

      <input type="text" id="title" placeholder="Task Title">

      <input type="text" id="desc" placeholder="Description">

      <input type="date" id="date">

      <select id="priority">
        <option>High</option>
        <option>Medium</option>
        <option>Low</option>
      </select>

      <select id="category">
        <option>Work</option>
        <option>Personal</option>
        <option>Study</option>
        <option>Shopping</option>
      </select>

      <button onclick="addTask()">Add Task</button>

    </div>

    <!-- TASK LIST -->
    <div class="task-list glass">

      <h2>Your Tasks</h2>

      <div id="tasks"></div>

    </div>

  </main>

</body>
</html>
